    <style>
      /* 기본 설정 */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
        color: #333;
      }

      /* 컨테이너 설정 */
      .container {
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      /* 사진 그리드 설정 */
      .photo-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr); /* 3개 열로 배열 */
        gap: 15px;
        justify-items: center; /* 가운데 정렬 */
      }

      /* 사진 카드 스타일 */
      .photo-card {
        position: relative;
        cursor: pointer;
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        transition: transform 0.3s;
        width: 100%; /* 카드 너비를 100%로 설정 */
        max-width: 300px; /* 카드의 최대 너비 */
      }

      .photo-card:hover {
        transform: scale(1.05);
      }

      .photo,
      .video {
        width: 100%;
        border-radius: 8px;
      }

      /* 제목 스타일 */
      .caption {
        text-align: center;
        margin-top: 5px;
        font-size: 1rem;
        color: #555;
      }

      /* 모달 스타일 */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        justify-content: center;
        align-items: center;
        z-index: 1000;
        overflow: auto; /* 스크롤 가능하도록 설정 */
      }

      .modal-content {
        position: relative;
        max-width: 90%; /* 모달 최대 너비 설정 */
        max-height: 90%; /* 모달 최대 높이 설정 */
        overflow: auto; /* 내용이 넘칠 경우 스크롤 */
      }

      .modal img,
      .modal video {
        max-width: 100%; /* 이미지/비디오의 최대 너비 설정 */
        max-height: 100%; /* 이미지/비디오의 최대 높이 설정 */
        display: block; /* 블록으로 표시하여 여백 제거 */
        margin: 0 auto; /* 중앙 정렬 */
      }

      .close {
        position: absolute;
        top: 10px;
        right: 10px;
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
      }

      /* 페이지네이션 버튼 스타일 */
      .pagination {
        display: flex;
        justify-content: center;
        margin: 20px 0;
      }

      .page-btn {
        background: #ff6b6b;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        margin: 0 5px;
        transition: background 0.3s;
      }

      .page-btn:hover {
        background: #ff3b3b;
      }
    </style>

      let currentPage = 1;
      const imagesPerPage = 9; // 한 페이지에 표시할 이미지 수
      const totalImages = photos.length; // 총 이미지 수

      // 현재 페이지에 따라 사진을 표시하는 함수
      function displayPhotos() {
        const photoGrid = document.getElementById("photoGrid");
        photoGrid.innerHTML = ""; // 현재 사진을 지우기

        // 시작 및 종료 인덱스 계산
        const start = (currentPage - 1) * imagesPerPage;
        const end = start + imagesPerPage;

        // 현재 페이지의 사진을 슬라이스하여 카드 생성
        const currentPhotos = photos.slice(start, end);
        currentPhotos.forEach((photo) => {
          const card = document.createElement("div");
          card.className = "photo-card";

          // 파일 확장자 확인
          const fileExtension = photo.src
            .split(".")
            .pop()
            .split("?")[0]
            .toLowerCase();
          let mediaElement;
          if (fileExtension === "mp4") {
            // 비디오 요소 생성
            mediaElement = document.createElement("video");
            mediaElement.className = "video";
            mediaElement.src = photo.src;
            mediaElement.controls = true;
            mediaElement.onclick = (e) => {
              e.stopPropagation(); // 비디오 클릭 시 모달 열리지 않도록 함
              openModal(photo.src, "video");
            };
          } else {
            // 이미지 요소 생성
            mediaElement = document.createElement("img");
            mediaElement.className = "photo";
            mediaElement.src = photo.src;
            mediaElement.alt = photo.caption;
            mediaElement.onclick = () => openModal(photo.src, "image");
          }

          const caption = document.createElement("div");
          caption.className = "caption";
          caption.textContent = photo.caption;

          card.appendChild(mediaElement);
          card.appendChild(caption);
          photoGrid.appendChild(card);
        });
      }

      // 현재 페이지를 변경하는 함수
      function changePage(direction) {
        currentPage += direction;
        if (currentPage < 1) currentPage = 1; // 페이지 0으로 돌아가지 않도록 방지
        if (currentPage > Math.ceil(totalImages / imagesPerPage))
          currentPage = Math.ceil(totalImages / imagesPerPage); // 마지막 페이지 넘어가지 않도록 방지
        displayPhotos(); // 표시된 사진 업데이트
      }

      // 클릭한 이미지 또는 비디오로 모달을 여는 함수
      function openModal(src, type) {
        const modal = document.getElementById("modal");
        const modalContent = document.getElementById("modalContent");
        modalContent.innerHTML = ""; // 기존 콘텐츠 지우기

        if (type === "video") {
          const video = document.createElement("video");
          video.src = src;
          video.controls = true;
          video.autoplay = true;
          video.style.maxWidth = "100%";
          video.style.maxHeight = "100%";
          modalContent.appendChild(video);
        } else {
          const img = document.createElement("img");
          img.src = src;
          img.alt = "확대 이미지";
          modalContent.appendChild(img);
        }

        modal.style.display = "flex"; // 모달 보여주기
      }

      // 모달을 닫는 함수
      function closeModal() {
        const modal = document.getElementById("modal");
        modal.style.display = "none"; // 모달 숨기기
      }

      // 초기 사진 표시
      displayPhotos();
    </script>
