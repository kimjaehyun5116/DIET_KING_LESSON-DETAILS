<!doctype html>
<html lang="ko" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="MacJae" />
    <meta name="keywords" content="핏로그" />
    <meta name="description" content="핏로그" />

    <!-- sns share -->
    <meta property="og:url" content="https://diet-king-app.netlify.app/" />
    <meta property="og:title" content="핏로그" />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://firebasestorage.googleapis.com/v0/b/diet-king-b567d.appspot.com/o/images%2Ffitlog.jpeg?alt=media&token=98a84ebd-6ef1-4890-af3b-b8f2a42601da"
    />
    <meta property="og:description" content="핏로그" />

    <!--favicon-->
    <link
      rel="shortcut icon"
      href="https://firebasestorage.googleapis.com/v0/b/diet-king-b567d.appspot.com/o/images%2Fkakao400.jpg?alt=media&token=b8095014-0c64-40ef-b467-166f8f2ba90d"
    />
    <link
      rel="apple-touch-icon-precomposed"
      href="https://firebasestorage.googleapis.com/v0/b/diet-king-b567d.appspot.com/o/images%2Fkakao400.jpg?alt=media&token=b8095014-0c64-40ef-b467-166f8f2ba90d"
    />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5900014929670391"
      crossorigin="anonymous"
    ></script>
    <title>Diet-King</title>
    <style>
      body {
        background-color: #121212; /* 전체 배경 어두운 테마 */
        color: #ffffff;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        display: none; /* 초기 로딩 화면에 숨김 */
        background-color: #444242; /* 컨테이너 카드 스타일 */
        text-align: center;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); /* 부드러운 그림자 */
      }
      .splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #121212;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        animation: fadeOut 5s ease-out forwards;
      }
      .splash-screen img {
        width: 80%;
        height: auto;
      }
      @keyframes fadeOut {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          visibility: hidden;
        }
      }
      .login-buttons {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0px;
      }
      .login-buttons img {
        width: 200px;
        height: auto;
        border-radius: 8px;
        transition: transform 0.2s;
        cursor: pointer;
      }
      .login-buttons img:hover {
        transform: scale(1.05);
      }
      .message {
        margin-top: 20px;
        font-size: 16px;
        color: #e0e0e0; /* 글자 색상 - 밝은 회색 */
      }
    </style>
  </head>
  <body>
    <div class="splash-screen">
      <img
        src="https://firebasestorage.googleapis.com/v0/b/diet-king-b567d.appspot.com/o/images%2Ffitlog.jpeg?alt=media&token=98a84ebd-6ef1-4890-af3b-b8f2a42601da"
        alt="로고"
      />
    </div>
    <div class="container">
      <div class="logo">
        <h1>로그인 페이지</h1>
      </div>
      <div class="login-buttons">
        <a id="kakaoLogin">
          <img
            src="https://www.gb.go.kr/Main/Images/ko/member/certi_kakao_login.png"
            alt="Kakao Login"
          />
        </a>
        <a id="googleLogin">
          <img
            src="https://developers.google.com/identity/images/btn_google_signin_dark_normal_web.png"
            alt="Google Login"
          />
        </a>
      </div>
      <div class="message" id="message"></div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics.js";
      import {
        getAuth,
        signInWithPopup,
        OAuthProvider,
        GoogleAuthProvider,
        updateProfile,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
      import {
        getFirestore,
        doc,
        setDoc,
        getDoc,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCx_AlSQLpW-KpYXpk0M2mDxVb7CZa_xUk",
        authDomain: "diet-king-b567d.firebaseapp.com",
        projectId: "diet-king-b567d",
        storageBucket: "diet-king-b567d.appspot.com",
        messagingSenderId: "11155339798",
        appId: "1:11155339798:web:423854835f18e0b7c21337",
        measurementId: "G-N9N8T32MVH",
      };

      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth();
      const db = getFirestore(app);

      // Kakao 로그인 처리
      const kakaoProvider = new OAuthProvider("oidc.diet-king");
      document.getElementById("kakaoLogin").addEventListener("click", () => {
        signInWithPopup(auth, kakaoProvider)
          .then(async (result) => {
            const user = result.user;
            const uid = user.uid;

            // 사용자 프로필을 Firestore에 저장
            const userDoc = doc(db, "users", uid);
            await setDoc(userDoc, {
              displayName: user.displayName,
              email: user.email,
            });

            document.getElementById("message").innerText = "로그인 성공!";
            window.location.href = "dashboard.html"; // 대시보드 페이지로 이동
          })
          .catch((error) => {
            console.error("Error during sign-in:", error);
            document.getElementById("message").innerText =
              "로그인 중 오류가 발생했습니다.";
          });
      });

      // Google 로그인 처리
      const googleProvider = new GoogleAuthProvider();
      document.getElementById("googleLogin").addEventListener("click", () => {
        signInWithPopup(auth, googleProvider)
          .then(async (result) => {
            const user = result.user;
            const uid = user.uid;

            // 사용자 프로필을 Firestore에 저장
            const userDoc = doc(db, "users", uid);
            await setDoc(userDoc, {
              displayName: user.displayName,
              email: user.email,
            });

            document.getElementById("message").innerText = "로그인 성공!";
            window.location.href = "dashboard.html"; // 대시보드 페이지로 이동
          })
          .catch((error) => {
            console.error("Error during sign-in:", error);
            document.getElementById("message").innerText =
              "로그인 중 오류가 발생했습니다.";
          });
      });
      window.addEventListener("load", () => {
        // 2초 후 컨테이너 표시
        setTimeout(() => {
          document.querySelector(".splash-screen").style.display = "none";
          document.querySelector(".container").style.display = "block";
        }, 2000);
      });
    </script>
  </body>
</html>
