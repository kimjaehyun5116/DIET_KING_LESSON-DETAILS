<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="https://firebasestorage.googleapis.com/v0/b/diet-king-b567d.appspot.com/o/images%2Fa6.jpeg?alt=media&token=b2c61f5f-4811-40d0-ba17-f4fd4c3d917a"
    />
    <link
      rel="apple-touch-icon-precomposed"
      href="https://firebasestorage.googleapis.com/v0/b/diet-king-b567d.appspot.com/o/images%2Fa6.jpeg?alt=media&token=b2c61f5f-4811-40d0-ba17-f4fd4c3d917a"
    />
    <title>사랑의 고백</title>
    <meta property="og:title" content="진영아, 니가 너무 좋아❤️" />
    <meta
      property="og:description"
      content="나랑 만나줄래? 많이 사랑해 줄게❤️"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cute+Font&family=Jua&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Jua", sans-serif;
        background-color: #f0f8ff;
        text-align: center;
        padding: 20px;
        margin: 0;
        overflow: hidden;
        position: relative;
        overflow-y: scroll;
      }

      #container {
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        padding: 30px;
        max-width: 600px;
        margin: 0 auto;
        position: relative;
        overflow: hidden;
      }

      h1 {
        color: #ff69b4;
        font-size: 3rem;
        font-family: "Cute Font", cursive;
        margin-bottom: 20px;
        animation: fadeIn 2s ease-in;
      }

      p {
        font-size: 1.3rem;
        line-height: 1.6;
        color: #333;
        letter-spacing: 0.02em;
      }

      button {
        background-color: #ff69b4;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 18px;
        transition:
          background-color 0.3s,
          transform 0.2s;
        margin-top: 20px;
      }

      button:hover {
        background-color: #ff1493;
        transform: scale(1.1);
      }

      #confession {
        background-color: #ffebf0;
        border-radius: 10px;
        padding: 20px;
        margin-top: 20px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        transform: translateY(20px);
        opacity: 0;
        transition:
          opacity 0.5s ease-in-out,
          transform 0.5s ease-in-out;
      }

      #confession.show {
        opacity: 1;
        transform: translateY(0);
        margin-bottom: 50px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* 하트 애니메이션 스타일 */
      .heart {
        position: absolute;
        font-size: 2rem;
        color: #ff69b4;
        pointer-events: none;
        animation: float 5s linear infinite;
      }

      @keyframes float {
        0% {
          transform: translateY(0) translateX(0);
          opacity: 1;
        }
        100% {
          transform: translateY(-100vh) translateX(100vw);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>
        내 사랑🧡<br />
        진영이에게
      </h1>
      <iframe
        width="300"
        height="150"
        src="https://www.youtube.com/embed/YRcYiIBuWMQ?autoplay=1&loop=1&loop=1&playlist=YRcYiIBuWMQ"
        frameborder="0"
        allow="autoplay; encrypted-media"
        allowfullscreen
      >
      </iframe>
      <div id="message">
        <p>여기서 당신에게<br />제 마음을 전하려 합니다.</p>
      </div>
      <button id="showMessageButton">내용 열어보기</button>
      <div id="confession">
        <p>
          당신을 만나서 정말 감사하고 행복한 하루를 보내고 있습니다. 우리의 모든
          순간이 소중하고, 앞으로도 함께하고 싶습니다. 언제나 초심이 변하지 않는
          한결같은 마음으로 당신을 대하려합니다. 서로 노력하면서 이쁜사랑
          키워가보려고 합시다. 사랑합니다!
        </p>
      </div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const showMessageButton = document.getElementById("showMessageButton");
        const confession = document.getElementById("confession");
        const body = document.body;

        showMessageButton.addEventListener("click", function () {
          if (confession.classList.contains("show")) {
            confession.classList.remove("show");
            showMessageButton.textContent = "나의 고백 읽기";
          } else {
            confession.classList.add("show");
            showMessageButton.textContent = "메시지 숨기기";

            // 하트 애니메이션 생성
            for (let i = 0; i < 20; i++) {
              const heart = document.createElement("div");
              heart.className = "heart";
              heart.textContent = "❤️";
              heart.style.left = Math.random() * 100 + "vw";
              heart.style.top = Math.random() * 100 + "vh";
              heart.style.animationDuration = Math.random() * 3 + 2 + "s";
              body.appendChild(heart);

              // 하트 애니메이션 종료 후 제거
              setTimeout(() => {
                body.removeChild(heart);
              }, 5000); // 애니메이션과 동일한 시간
            }
          }
        });
      });
    </script>
  </body>
</html>
